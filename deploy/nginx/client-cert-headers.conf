# The four forwarded client-identity headers.
#
# THIS FILE IS THE SECURITY BOUNDARY FOR THE DEVICE PLANE. Read it before
# editing anything that includes it.
#
# `server/src/ubuntuguard/security/device_auth.py` derives a device's identity
# from these headers. They are therefore exactly as powerful as the client
# certificate itself: anyone who can set X-Client-Cert can claim to be any
# device. Two things stop that, and this file is one of them.
#
#   1. The application refuses these headers outright unless the request
#      arrives from an address in UBUNTUGUARD_TRUSTED_PROXY_IPS (default
#      127.0.0.1 and ::1). Not "ignores" - refuses, so a misconfiguration
#      fails loudly rather than quietly authenticating strangers.
#
#   2. nginx overwrites all four UNCONDITIONALLY, on every request, on every
#      listener. That is what makes a client-supplied header unforgeable: a
#      caller who sends its own X-Client-Cert has it replaced by whatever the
#      TLS layer actually verified, which on a listener with no client
#      certificate is the empty string.
#
# `proxy_set_header` with no value is not how you clear a header in nginx, so
# every one of these assigns an $ssl_* variable instead. On a listener without
# `ssl_verify_client`, those variables evaluate to "NONE" and "" respectively,
# which is precisely the right answer to forward.
#
# THE TRAP, and the reason this is a separate file rather than four lines
# copied around: nginx's proxy_set_header directives are NOT inherited into a
# `location` that defines any proxy_set_header of its own. A location that sets
# one header silently drops the other three, and the failure mode is a device
# plane that stops authenticating for reasons invisible in the config. Every
# location that proxies to the API must `include` this file. The test in
# `server/tests/test_nginx_config.py` fails if one does not.
#
# Note what is NOT here: nginx's $ssl_client_fingerprint. That variable is
# SHA-1. The whole certificate is forwarded instead and the application
# computes SHA-256 itself, which also lets it re-derive subject and validity
# from the certificate rather than trusting the proxy to summarise them.

proxy_set_header X-Client-Verify $ssl_client_verify;
proxy_set_header X-Client-Cert   $ssl_client_escaped_cert;
proxy_set_header X-Client-DN     $ssl_client_s_dn;
proxy_set_header X-Client-Serial $ssl_client_serial;

# Overwritten for the same reason, even though the application deliberately
# ignores it: if nginx did not set it, a client's own X-Forwarded-For would be
# passed through untouched.
#
# DO NOT run uvicorn with --proxy-headers or a permissive
# --forwarded-allow-ips. Those make Starlette rewrite `request.client.host`
# from this header, which is the single value `is_trusted_proxy()` relies on.
# The trusted-proxy check would then be comparing an attacker-supplied string
# against the allowlist, and every refusal above becomes bypassable. The
# documented run command has no such flag; keep it that way.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Host              $host;
