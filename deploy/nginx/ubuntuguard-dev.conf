# UbuntuGuard — development nginx configuration: TLS and mTLS for the device plane.
#
# Install as /etc/nginx/conf.d/ubuntuguard-dev.conf. Files in conf.d are
# included inside the http{} block, which is why limit_req_zone below is valid
# here but would not be inside a server{}.
#
# Generate the certificates this file references with:
#     sudo deploy/nginx/make_dev_tls.py
#
# ---------------------------------------------------------------------------
# WHY TWO LISTENERS
# ---------------------------------------------------------------------------
# The device plane has two kinds of request and they need opposite TLS
# settings, which one server block cannot provide:
#
#   POST /api/v1/enroll          has NO client certificate. The device does not
#                                have an identity yet - acquiring one is the
#                                point of the call. Its only credential is a
#                                single-use token in the body.
#
#   POST /api/v1/devices/me/*    MUST have a client certificate, verified
#                                against the internal device CA.
#
# So: 8443 serves enrollment with no client certificate requested at all, and
# 8444 serves device management with `ssl_verify_client on`, which makes nginx
# refuse the handshake outright when no valid certificate is presented.
#
# A single listener with `ssl_verify_client optional` plus an `if` inside a
# location would also work and is deliberately NOT used here: it puts the
# enforcement in a conditional that is easy to edit wrongly, and nginx's `if`
# in a location context is documented as surprising. Two listeners make the
# requirement structural - there is no code path on 8444 that reaches the
# application without a verified certificate, because nginx terminates the
# connection before any location is selected.
#
# `ssl_verify_client optional_no_ca` is NEVER acceptable here. It forwards the
# certificate without verifying its chain, so $ssl_client_verify stops meaning
# "this certificate was issued by our CA" while still reporting SUCCESS. Every
# check in device_auth.py that trusts SUCCESS would then be trusting nothing.
#
# For production, see the hostname-based single-port alternative in
# deploy/nginx/README.md. The two-port split is a development convenience; the
# security properties are identical either way.
#
# ---------------------------------------------------------------------------
# WHAT NGINX PROVES, AND WHAT IT DOES NOT
# ---------------------------------------------------------------------------
# nginx proves the client holds a private key for a certificate issued by the
# internal device CA and currently within its validity window. That is all.
#
# It does NOT prove the device is still authorised. There is no CRL here, by
# design: revocation is enforced by the application on every single request
# (`DbDeviceResolver.resolve_device` requires status == 'active'), which takes
# effect on the device's very next call. A CRL would be strictly worse - it
# propagates on a timer, so a revoked laptop would keep working until the next
# refresh. If you add `ssl_crl` later, it is defence in depth and the
# application check stays the authority.

# --- rate limiting --------------------------------------------------------- #
# Zones must be declared at http{} level. This is the control that closes the
# finding in agent/SECURITY-FINDINGS.md item 4.
#
# The concern is not token guessing: an enrollment token is 32 random bytes and
# there is nothing to guess. It is that /enroll is unauthenticated and does
# asymmetric work - a small request causes a CSR parse, a key-size check and a
# signature verification. Limiting it in nginx bounds that work before it
# reaches Python.
#
# 10r/m with burst=5 nodelay: an operator enrolling a handful of laptops from
# one office NAT is unaffected; a script is not. `nodelay` serves the burst
# immediately rather than queueing it, because a queued enrollment that
# eventually succeeds after the token's own validity window is worse than a
# fast 429 the agent will retry on backoff.
limit_req_zone $binary_remote_addr zone=ug_enroll:10m rate=10r/m;

# Admin login is limited too. It is not part of the device plane, but it is the
# other unauthenticated endpoint that does expensive work (Argon2id), and the
# application's own control there is per-account lockout, which does not help
# against one attacker spraying many account names.
limit_req_zone $binary_remote_addr zone=ug_login:10m rate=30r/m;

limit_req_status 429;

upstream ubuntuguard_api {
    # The application MUST remain bound to loopback. Its device plane believes
    # the X-Client-* headers only from a trusted peer, and loopback is what
    # makes the default UBUNTUGUARD_TRUSTED_PROXY_IPS correct. Expose port 8000
    # on any other interface and the headers become settable by anyone who can
    # reach it.
    server 127.0.0.1:8000;
    keepalive 16;
}

# --------------------------------------------------------------------------- #
# 8443 — enrollment and the admin API. No client certificate.
# --------------------------------------------------------------------------- #
server {
    listen 127.0.0.1:8443 ssl;
    listen [::1]:8443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/ubuntuguard/dev-tls/server.crt;
    ssl_certificate_key /etc/ubuntuguard/dev-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ug_enroll_tls:1m;
    ssl_session_tickets off;

    # No ssl_verify_client and no ssl_client_certificate on this listener, so
    # nginx neither requests nor verifies a client certificate. The include
    # below still runs, and still overwrites all four headers - with "NONE" and
    # "" - which is what stops a caller smuggling its own identity in through
    # the one endpoint that has no identity of its own.

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    location = /api/v1/enroll {
        limit_req zone=ug_enroll burst=5 nodelay;
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/auth/login {
        limit_req zone=ug_login burst=10 nodelay;
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # The device plane is not reachable here. Returning 421 Misdirected Request
    # rather than proxying is deliberate: an agent pointed at the wrong port
    # should be told so, not handed a 401 it would read as a credential problem
    # and retry forever.
    location ^~ /api/v1/devices/me/ {
        return 421;
    }

    location / {
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

# --------------------------------------------------------------------------- #
# 8444 — device management. A valid client certificate is mandatory.
# --------------------------------------------------------------------------- #
server {
    listen 127.0.0.1:8444 ssl;
    listen [::1]:8444 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/ubuntuguard/dev-tls/server.crt;
    ssl_certificate_key /etc/ubuntuguard/dev-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ug_device_tls:1m;
    ssl_session_tickets off;

    # --- mutual TLS -------------------------------------------------------- #
    # THE INTERNAL DEVICE CA, and nothing else. This is the CA whose private
    # key `services/ca.py` holds and signs device certificates with. It is NOT
    # the CA that issued this listener's own server certificate above, and
    # conflating the two is the easiest serious mistake available in this file:
    # point it at a public CA bundle and any certificate from any public issuer
    # becomes a valid device identity.
    #
    # Source of truth is whatever UBUNTUGUARD_CA_CERT_PATH names (server/var/ca.crt
    # by default). make_dev_tls.py copies it here so nginx has a root-owned path
    # and the repository stays authoritative. Re-run that script after
    # `ubuntuguard.cli init-keys` regenerates the CA, or every device
    # certificate stops verifying.
    ssl_client_certificate /etc/ubuntuguard/dev-tls/device-ca.crt;

    # `on`, not `optional`. nginx aborts the handshake when no valid
    # certificate is presented, so nothing below is reachable without one.
    ssl_verify_client on;

    # The device CA is created with BasicConstraints(ca=True, path_length=0),
    # so it can issue end-entity certificates and nothing else. Depth 1 says
    # the same thing to nginx: a chain with an intermediate is not something
    # this CA can legitimately have produced.
    ssl_verify_depth 1;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 256k;

    # Enrollment is not reachable here either. A device presenting a
    # certificate to get its first certificate is a contradiction, and allowing
    # it would mean an enrolled device could spend tokens for others.
    location = /api/v1/enroll {
        return 421;
    }

    location ^~ /api/v1/devices/me/ {
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Nothing else is served on the device listener. The admin plane lives on
    # 8443; exposing it here as well would mean a device certificate sitting in
    # front of routes that have nothing to do with devices.
    location / {
        return 404;
    }
}
