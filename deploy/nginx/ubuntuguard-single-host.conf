# UbuntuGuard — single-hostname configuration. BOTH planes on one listener.
#
# Install as /etc/nginx/conf.d/ubuntuguard-single-host.conf
#
# Generate the certificates this file references with:
#     sudo deploy/nginx/make_dev_tls.py
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
# `ubuntuguard-dev.conf` splits the two planes across ports 8443 and 8444. That
# works, and an INSTALLED agent cannot use it.
#
# The agent has one `server_url`. Reaching a second port needs
# `UG_AGENT_DEVICE_URL`, which is a precedence-level-4 override readable only
# when `UG_AGENT_DEV=1` - and setting that flag forces `release_build` to False,
# which is reported at enrollment and flags the device in the dashboard.
# `ALLOWED_CONFIG_KEYS` is exactly `{server_url, server_ca_bundle}`, so there is
# no way to tell a release build about a second URL either.
#
# So under the two-port configuration an agent installed by
# `ubuntuguard-agent-installer.sh` can enrol OR heartbeat, never both.
#
# `AgentConfig.device_base_url` says the production answer is "one hostname on
# 443, with nginx choosing the mTLS listener by SNI". That is not achievable:
# SNI selects a server block by HOSTNAME, so one hostname means one server
# block, which means one `ssl_verify_client` setting for both planes. Two
# hostnames would work but need the dev-only override again.
#
# This file is the configuration that does work for an installed agent: one
# hostname, one port, one `server_url`, both planes.
#
# ---------------------------------------------------------------------------
# HOW IT STAYS SAFE WITH `ssl_verify_client optional`
# ---------------------------------------------------------------------------
# The two-listener design made "a verified certificate was presented" a
# structural property: nginx aborts the handshake on 8444 before any location is
# selected. That is stronger, and it is the reason `ubuntuguard-dev.conf`
# exists and is unchanged.
#
# Here the property is enforced one layer up, by the application, and it is
# sound for three specific reasons:
#
#   1. `optional` VERIFIES THE CHAIN. Unlike `optional_no_ca`, which is banned
#      everywhere in this directory and asserted absent by a test,
#      `ssl_verify_client optional` validates any presented certificate against
#      `ssl_client_certificate` below. So `$ssl_client_verify = SUCCESS` means
#      exactly what it means on 8444: issued by the internal device CA and
#      inside its validity window. A certificate from any other issuer gets
#      FAILED, not SUCCESS.
#
#   2. THE HEADERS ARE OVERWRITTEN UNCONDITIONALLY. Every proxying location
#      includes client-cert-headers.conf, which sets all four identity headers
#      from nginx variables on every request. A client cannot smuggle
#      `X-Client-Verify: SUCCESS` because its own value is replaced - with
#      "NONE" when it presented nothing.
#
#   3. THE APPLICATION REFUSES ANYTHING ELSE. `security/device_auth.py`
#      compares the forwarded value against `NGINX_VERIFY_SUCCESS` and raises
#      `client_cert_not_verified` for FAILED and `client_cert_missing` for
#      NONE. It then re-derives the fingerprint, subject and validity window
#      from the forwarded certificate itself rather than trusting any header
#      about them, and `DbDeviceResolver` additionally requires the device row
#      to be active. None of that changes here.
#
# Note what is NOT used: an `if` inside a location. deploy/nginx/README.md
# rejected `optional` plus a conditional on the grounds that it "puts the
# enforcement in a conditional that is easy to edit wrongly", and that
# objection is correct. There is no conditional in this file. The enforcement
# is the application's, where it already was - nginx's only job here is to
# terminate TLS and report truthfully what it saw.
#
# The trade, stated plainly: on 8444 an unauthenticated caller cannot complete
# a TLS handshake at all. Here it can, and is then refused with 401 by the
# application. That is a slightly larger surface - a TLS handshake and one
# proxied request - in exchange for an agent that can actually be installed.
#
# ---------------------------------------------------------------------------
# THIS FILE AND ubuntuguard-dev.conf ARE ALTERNATIVES. INSTALL ONE.
# ---------------------------------------------------------------------------
# They cannot both live in conf.d. Everything in conf.d is included inside the
# single `http{}` block, and `limit_req_status` may appear only once per
# context, so installing both produces:
#
#     [emerg] "limit_req_status" directive is duplicate
#
# and nginx refuses to start. `limit_req_zone` is fine to repeat because each
# declares a differently-named zone; `limit_req_status` is not.
#
# That is not a packaging accident to work around - it is correct. One of these
# serves the planes on two ports for development, the other serves them on one
# for a real deployment. A host has one answer to that question.
#
#     sudo mv /etc/nginx/conf.d/ubuntuguard-dev.conf ~/ubuntuguard-dev.conf.off
#     sudo install -m 0644 deploy/nginx/ubuntuguard-single-host.conf /etc/nginx/conf.d/
#     sudo nginx -t && sudo systemctl reload nginx
#
# `server/tests/test_nginx_config.py` asserts that no two configurations in
# this directory declare the same http-context singleton directive, so a third
# file cannot reintroduce the clash silently.
#
# ---------------------------------------------------------------------------
# PORT
# ---------------------------------------------------------------------------
# 9443 rather than 8443 so that an operator who installs this while the dev
# config is still present gets the clear `limit_req_status` error above, rather
# than a confusing "address already in use" that looks like a stray process.
# Use 443 in production and drop the port from the agent's `server_url`.

limit_req_zone $binary_remote_addr zone=ug_sh_enroll:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ug_sh_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ug_sh_installer:10m rate=60r/m;

limit_req_status 429;

upstream ubuntuguard_api_sh {
    # The application MUST remain bound to loopback. Its device plane believes
    # the X-Client-* headers only from a trusted peer, and loopback is what
    # makes the default UBUNTUGUARD_TRUSTED_PROXY_IPS correct.
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/ubuntuguard/dev-tls/server.crt;
    ssl_certificate_key /etc/ubuntuguard/dev-tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ug_sh_tls:1m;
    ssl_session_tickets off;

    # --- mutual TLS, requested but not required at the handshake ----------- #
    # THE INTERNAL DEVICE CA, and nothing else. This is the CA whose private
    # key `services/ca.py` signs device certificates with. It is NOT the CA
    # that issued this listener's own server certificate above. Point it at a
    # public bundle and any publicly issued certificate becomes a valid device
    # identity.
    ssl_client_certificate /etc/ubuntuguard/dev-tls/device-ca.crt;

    # `optional`, not `on`: POST /api/v1/enroll must work for a device that has
    # no certificate yet, and that is the whole reason this listener is shared.
    # NOT `optional_no_ca`, which would forward a certificate without verifying
    # its chain while still reporting SUCCESS - see the header comment and the
    # test that asserts it appears nowhere in this directory.
    ssl_verify_client optional;

    # The device CA is created with BasicConstraints(ca=True, path_length=0),
    # so a chain with an intermediate is not something it can have produced.
    ssl_verify_depth 1;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 256k;

    # --- enrollment: no client certificate, by necessity ------------------- #
    location = /api/v1/enroll {
        limit_req zone=ug_sh_enroll burst=5 nodelay;
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api_sh;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /api/v1/auth/login {
        limit_req zone=ug_sh_login burst=10 nodelay;
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api_sh;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/v1/installer {
        limit_req zone=ug_sh_installer burst=20 nodelay;
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api_sh;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- the device plane: a verified certificate, enforced by the app ----- #
    # No `if` here. The include overwrites X-Client-Verify from
    # $ssl_client_verify, and device_auth.py refuses anything that is not
    # SUCCESS. A caller with no certificate reaches this and gets 401
    # client_cert_missing.
    location ^~ /api/v1/devices/me/ {
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api_sh;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        include /etc/nginx/ubuntuguard/client-cert-headers.conf;
        proxy_pass http://ubuntuguard_api_sh;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
