# Alembic configuration.
#
# The database URL is NOT set here. It comes from
# UBUNTUGUARD_MIGRATION_DATABASE_URL via migrations/env.py, so no credential
# ever lands in a tracked file.
#
# Migrations run as the schema OWNER role, never as the application role. The
# application role deliberately lacks CREATE and ALTER; running migrations
# through it would hand it the ability to drop the audit table, which is the one
# thing the append-only design exists to prevent.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# Timestamped revision files sort chronologically in a directory listing, which
# makes a hand review of migration order possible.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
