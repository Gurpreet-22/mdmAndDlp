[project]
name = "ubuntuguard-server"
version = "0.1.0"
description = "UbuntuGuard MDM + DLP control plane"
requires-python = ">=3.12,<3.13"

# Dependency notes (the brief asks for a reason before adding anything):
#   fastapi/uvicorn  - mandated by the brief.
#   sqlalchemy 2 + alembic + psycopg - mandated. psycopg3 ships binary wheels, so
#       there is no libpq-dev build step, and it covers both sync and async if we
#       ever switch.
#   pydantic / pydantic-settings - mandated; settings carry the bounds.
#   argon2-cffi      - the reference Argon2 binding. The brief mandates Argon2id
#       and the standard library has no password KDF worth using here.
#   cryptography     - internal CA (CSR parsing, X.509 issuance) and Ed25519
#       policy signing. No credible stdlib alternative.
#
# Deliberately ABSENT:
#   PyJWT / python-jose - we use opaque random tokens looked up in the database.
#       That removes signing-key management, the whole alg-confusion bug class,
#       and the "cannot revoke a live JWT" problem, which sits badly in a product
#       whose selling point is fast revocation. A table lookup per request is
#       irrelevant at 10-50 devices.
#   passlib - unmaintained relative to argon2-cffi, and we need exactly one KDF.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Plain pydantic, NOT pydantic[email]. email-validator was tried and
    # removed: it rejects RFC 2606 reserved domains, so admin@example.invalid
    # fails, and so would admin@company.internal or admin@localhost. Refusing a
    # legitimate internal address is a worse bug than the loose structural
    # check in schemas.AdminEmail, which is all a login identifier needs.
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubuntuguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    # Tests that need a live PostgreSQL. Run with: pytest -m postgres
    "postgres: requires a running PostgreSQL instance",
    # Tests that DROP every table. They need UBUNTUGUARD_ALLOW_DESTRUCTIVE_TESTS=1,
    # because a plain `pytest` run should never wipe a developer's database.
    "destructive: drops and recreates the schema; opt in explicitly",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RET", "SIM", "PTH"]
# S101 (assert) is fine in tests; enforced everywhere else.
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Migrations are generated. E501 is unavoidable because a long CHECK constraint
# is one SQL string literal that cannot be wrapped without changing it.
"migrations/versions/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# B008 warns about function calls in argument defaults, which is precisely how
# FastAPI declares dependencies. Listing the markers is the documented fix and
# keeps B008 active for the cases where it catches a real shared-mutable bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "ubuntuguard.api.deps.require_capability",
]

[tool.mypy]
python_version = "3.12"
packages = ["ubuntuguard"]
mypy_path = "src"
strict = true
warn_unreachable = true
